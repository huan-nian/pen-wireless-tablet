# 发布时的打包脚本：推送以 v 开头的 tag 时，自动构建并创建 Release。
#
# 为什么需要它：接收端用了 WinRT/C# 投影，Android 端需要 JDK 与 Android SDK，
# 本地手工打包容易漏步骤。标签一推就出包，Release 页面的附件也自动带上。
#
# 用法：
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 说明：APK 用的是 debug 签名（与 scripts/package-release.cmd 一致），
# 安装时会提示「未知来源」，这是 debug 签名的正常表现。
# 若以后要做正式签名，把 keystore 放进仓库 Secrets 并在这里加一步签名即可。

name: release

# ⚠️ 'on' 必须加引号。
#
# YAML 1.1 把裸写的 on/off/yes/no 当作**布尔值**，于是 `on:` 会被解析成键 `true:`。
# 虽然 GitHub Actions 的解析器对裸 on 通常能容错（这个工作流此前一直接触发正常），
# 但一旦被当成布尔键，触发器就会失效——表现为：
#   · 侧栏里的工作流名显示成文件路径而不是 "release"
#   · 运行记录里有 0 个 job、耗时 0 秒（解析阶段就失败了）
#   · 不再只响应 v* 标签，而是任何 push 都创建一个失败运行
# 加引号就能从根本上避免这个歧义，代价为零。
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，例如 1.0.2）'
        required: true
        default: '1.0.2'

permissions:
  contents: write

jobs:
  # ---------- Windows 接收端：不需要外部 SDK，最容易自动化 ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: 计算版本号
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}'.TrimStart('v') }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本：$version"

      - name: 自检（不注入输入，无需管理员权限）
        run: dotnet run --project PenReceiver.SelfTest -c Release

      - name: 发布自包含版（目标机无需 .NET）
        run: >
          dotnet publish PenReceiver/PenReceiver.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o dist/PenReceiver-win-x64

      - name: 发布框架依赖版（体积小）
        run: >
          dotnet publish PenReceiver/PenReceiver.csproj
          -c Release -r win-x64 --self-contained false
          -p:DebugType=none -p:DebugSymbols=false
          -o dist/PenReceiver-win-x64-lite

      - name: 打包接收端
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/PenReceiver-win-x64/*'      -DestinationPath "dist/PenReceiver-$env:VERSION-win-x64.zip" -Force
          Compress-Archive -Path 'dist/PenReceiver-win-x64-lite/*' -DestinationPath "dist/PenReceiver-$env:VERSION-win-x64-lite.zip" -Force

      # 安装包：把自己的载荷压缩后嵌进 PenInstaller，产出单个 setup.exe。
      # 刻意不走 scripts\build-installer.cmd：那个脚本会重复发布一次接收端，
      # 而这里已经发布过了，重复跑纯属浪费时间。
      - name: 构建 Windows 安装包
        shell: pwsh
        run: |
          # 1) 压缩载荷（就是上面那份自包含产物）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $payload = 'PenInstaller/payload.zip'
          if (Test-Path $payload) { Remove-Item $payload -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'dist/PenReceiver-win-x64').Path, (Join-Path $PWD $payload),
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Write-Host "载荷 $((Get-Item $payload).Length) 字节"

          # 2) 编译安装器为单文件
          dotnet publish PenInstaller/PenInstaller.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:VERSION `
            -o PenInstaller/publish

          Copy-Item 'PenInstaller/publish/PenWirelessTablet-Setup.exe' `
            "dist/PenWirelessTablet-Setup-$env:VERSION.exe" -Force

      # 签名是可选的：仓库里没有证书（证书是发布者身份，不进仓库），
      # 所以 CI 上默认跳过，只在配置了证书 Secret 时才签。
      #
      # ⚠️ 判断「有没有配置证书」不能写成 `if: ${{ secrets.X != '' }}`：
      # GitHub 允许在 if 里用的上下文只有 github / env / vars / inputs / needs /
      # steps / job / runner，**secrets 不在其列**。那样写会让整个工作流文件
      # 校验失败——表现为工作流名显示成文件路径、每次 push 都产生一个 0 job 的
      # 失败运行，却完全看不出错在哪（这条踩坑记录保留在此，避免以后再写回去）。
      # 正确做法：把 Secret 经 env 传进来，在脚本里判断是否为空。
      - name: Authenticode 签名（未配置证书则自动跳过）
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64)) {
            Write-Host "未配置 CODESIGN_PFX_BASE64，跳过 Windows 代码签名。" -ForegroundColor Yellow
            Write-Host "如需 CI 产出已签名的程序，请把 signing\codesign.pfx 的 base64 与口令加入仓库 Secrets。"
            exit 0
          }

          New-Item -ItemType Directory -Force -Path signing | Out-Null
          [IO.File]::WriteAllBytes('signing/codesign.pfx', [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          Set-Content 'signing/codesign.pass' -Value $env:CODESIGN_PFX_PASSWORD -Encoding ASCII -NoNewline
          & scripts/sign-windows.ps1 -Version $env:VERSION

      - name: 生成校验值
        shell: pwsh
        run: |
          $files = @(
            "dist/PenWirelessTablet-Setup-$env:VERSION.exe",
            "dist/PenReceiver-$env:VERSION-win-x64.zip",
            "dist/PenReceiver-$env:VERSION-win-x64-lite.zip"
          )
          $lines = foreach ($f in $files) {
            if (Test-Path $f) { "$((Get-FileHash $f -Algorithm SHA256).Hash)  $(Split-Path $f -Leaf)" }
          }
          $lines | Set-Content 'dist/SHA256SUMS.txt' -Encoding ASCII
          $lines | ForEach-Object { Write-Host $_ }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  # ---------- Android APK ----------
  #
  # 这里刻意不使用 android-actions/setup-android：它在本项目上会在「安装 Android SDK」
  # 一步失败（7 秒即挂，与网络无关，改用官方 cmdline-tools 手动安装后稳定）。
  # 手动安装还有个好处：可以明确装出 compileSdk 需要的那个平台，
  # 本项目的 compileSdk 是 36 的 minorApiLevel 1，对应 platforms;android-36.1，
  # runner 预装的 SDK 里不一定有这个平台。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        run: |
          set -euo pipefail
          SDK="/usr/local/lib/android/sdk"

          # runner 镜像通常已在此装好 SDK。若没有，就直接下官方 cmdline-tools：
          # 比"从 sdkmanager 路径反推 SDK 根目录"可靠——那个推导在
          # cmdline-tools/latest/bin 这一层级上很容易算错一层。
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "未在 $SDK 找到 sdkmanager，下载官方 cmdline-tools…"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "SDK=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # 仓库里带了已接受的许可哈希，避免 sdkmanager 卡在交互式许可确认上
          mkdir -p "$SDK/licenses"
          cp PenClient/licenses/* "$SDK/licenses/" 2>/dev/null || true

          echo "sdkmanager 版本：$("$SDKMANAGER" --version 2>&1 | head -n1)"

          # 装构建必需组件。本项目的 compileSdk 是 36 的 minorApiLevel 1，
          # 对应 platforms;android-36.1；个别包不存在时不让整步失败，
          # 因为后面 AGP 还会按 android.builder.sdkDownload 兜底下载。
          yes | "$SDKMANAGER" --install --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" || echo "（部分组件安装失败，交给 AGP 兜底）"

          echo "--- 已安装的平台 ---"
          ls -1 "$SDK/platforms" 2>/dev/null || true
          echo "--- 已安装的构建工具 ---"
          ls -1 "$SDK/build-tools" 2>/dev/null || true

      - name: 注入签名密钥库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # 密钥库不进仓库（它是发布者身份），CI 上由 Secret 以 base64 注入。
          # 缺失时直接失败，避免悄悄产出一个未签名的包冒充正式版。
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "缺少 Secret：KEYSTORE_BASE64。请先按 README「正式签名」一节配置。" >&2
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/pen-release.keystore
          # storeFile 相对 app 模块目录解析，所以指向仓库根的 signing/
          cat > signing/keystore.properties <<EOF
          storeFile=../../signing/pen-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          echo "已写入 signing/keystore.properties（内容不打印）"
          ls -l signing/

      - name: 构建 APK
        working-directory: PenClient
        run: |
          # local.properties 会把 SDK 位置写死，CI 上用环境变量即可；
          # 同时打开 AGP 的按需下载，兜住 platforms/build-tools 版本差异
          echo "android.builder.sdkDownload=true" >> gradle.properties
          chmod +x gradlew
          # 构建正式签名版（release），不是 debug 版
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          set -euo pipefail
          APK="PenClient/app/build/outputs/apk/release/app-release.apk"
          # 用 runner 上的 apksigner 复核，确保产出的确实是正式签名包
          APKSIGNER="$(find /usr/local/lib/android/sdk/build-tools -name apksigner -type f | sort | tail -n1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs --verbose "$APK"
          # 证书主题里应当出现你的署名，否则说明用错了密钥库
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Huan Nian" \
            || { echo "签名证书主题不符，可能用错了密钥库" >&2; exit 1; }
          echo "签名校验通过"

      - name: 改名并收集
        run: |
          version='${{ github.event.inputs.version }}'
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          cp PenClient/app/build/outputs/apk/release/app-release.apk "dist/PenClient-$version.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  # ---------- 两个平台都构建完，一次性创建 Release ----------
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理附件
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.apk' \) -exec cp {} release/ \;
          ls -lh release/

      - name: 清理同标签的已存在 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          # --ssl-no-revoke 是给 Windows 上的 Git Bash 用的（证书吊销检查会失败），
          # 在 Linux runner 上是良性参数。
          CURL=(curl -sS --ssl-no-revoke
                -H "Authorization: Bearer $GH_TOKEN"
                -H 'Accept: application/vnd.github+json'
                -H 'User-Agent: pen-release-cleanup')
          echo "目标标签：$TAG"

          # 推送标签时 GitHub 会自动创建一个空 Release，此时再调创建接口会冲突。
          # 这里用 curl 显式判断状态码，不用 gh：
          # gh api 在资源不存在时以非零码退出，配合 set -e 会让整步失败
          # （实测就是这样挂掉的）。
          STATUS="$("${CURL[@]}" -o /tmp/rel.json -w '%{http_code}' "$API/releases/tags/$TAG" || true)"
          echo "按标签查询状态码：$STATUS"

          if [ "$STATUS" = "200" ]; then
            ID="$(grep -o '"id":[0-9]*' /tmp/rel.json | head -n1 | cut -d: -f2)"
            echo "删除已存在的 Release id=$ID"
            DEL="$("${CURL[@]}" -o /dev/null -w '%{http_code}' -X DELETE "$API/releases/$ID" || true)"
            echo "删除状态码：$DEL"
            [ "$DEL" = "204" ] || { echo "删除未成功，终止"; exit 1; }
          elif [ "$STATUS" = "404" ]; then
            echo "该标签下没有 Release，跳过删除"
          else
            echo "意外的查询状态码，终止"
            exit 1
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: 无线手写板 ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            把 Android 平板当作电脑的**无线手写板**：平板用触控笔（或手指）书写，
            笔迹以真正的 Windows Ink 注入电脑。不用装驱动、不用数据线，
            只要两边在同一个局域网。

            **下载哪个**

            | 文件 | 给谁用 |
            | --- | --- |
            | `PenWirelessTablet-Setup-*.exe` | **推荐**。Windows 单文件安装包，双击即装；内置运行环境，**安装时不需要联网、也不用预装 .NET** |
            | `PenReceiver-*-win-x64.zip` | 免安装绿色版，解压双击 `launch-receiver.cmd` 即可（同样自带运行环境） |
            | `PenReceiver-*-win-x64-lite.zip` | 体积小得多，但需要电脑已装 .NET 8 运行时 |
            | `PenClient-*.apk` | 平板端。**正式签名版**，可直接覆盖安装后续版本 |
            | `SHA256SUMS.txt` | 校验值，用于确认下载完整 |

            **三步用起来**

            1. **电脑**：运行安装包（或解压绿色版后双击 `launch-receiver.cmd`），
               UAC 窗口点「是」。首次运行请在防火墙提示里允许**专用网络**。
            2. **平板**：安装 APK（首次需允许「安装未知应用」），
               打开后点「扫描电脑」→「连接」。
            3. **开始写**：点右下角「开始书写」，用触控笔在白色区域书写。
               底部可切换**手写笔 / 触摸**模式 —— 触摸模式下没有笔也能用手指写。

            **关于 SmartScreen 提示**

            本项目的 Windows 程序使用**自签证书**签名。首次运行仍可能看到
            「Windows 已保护你的电脑」，这是自签证书的固有限制（该拦截依据证书声誉，
            只有 CA 签发的证书才能消除），**不是病毒**。点「更多信息」→「仍要运行」即可。

            完整说明与快捷键表见仓库
            [`README`](https://github.com/huan-nian/pen-wireless-tablet#readme)，
            逐步上手与已知限制见
            [`docs/release-notes-v1.0.1.md`](https://github.com/huan-nian/pen-wireless-tablet/blob/main/docs/release-notes-v1.0.1.md)。
          files: release/*
